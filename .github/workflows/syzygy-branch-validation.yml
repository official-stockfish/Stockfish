name: Validate Syzygy test branch
on:
  push:
    branches:
      - tests/syzygy-reset-lifecycle-2026
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syzygy-validation:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Download NNUE networks
        run: make -C src net
      - name: Build Stockfish
        run: make -C src -j2 build ARCH=x86-64
      - name: Bench signature
        working-directory: src
        run: bash ../tests/signature.sh
      - name: Test Syzygy lifecycle
        run: python3 tests/syzygy_lifecycle.py src/stockfish
